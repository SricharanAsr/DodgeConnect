<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="description" content="Modern automotive digital ecosystem.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Website</title>
    <link rel="stylesheet" href="style1.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <script
      src="https://kit.fontawesome.com/7a4b62b0a4.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <main>
      <section id="hero">
        <div class="container">
          <div class="card">
            <img src="tom.jpg" alt="hero image" />
            <div class="card_content">
              <h3>Timothy Kuniskis<br>CEO of Dodge</h3>
            </div>
          </div>
          <div class="hero_content">
            <h1>
              <span class="hi_text">Hi</span> , I am
              <span class="name_text">Timothy Kuniskis</span>
            </h1>
            <h2>Welcome to world of Dodge</h2>
          </div>
        </div>
      </section>
      <section id="project">
        <h2>Awards</h2>
        <div class="container">
          <div class="project_container">
            <div class="grid_item">
              <div class="card">
                <img src="carfax.png" alt="Project 1" />
                <div class="card_content">
                  <h3>Top Dealer Award 2022</h3>
                </div>
              </div>
            </div>
            <div class="grid_item">
              <div class="card">
                <img src="kelly blue book.png" alt="Project 1" />
                <div class="card_content">
                  <h3>kelly blue book Styling Award 2022</h3>
                </div>
              </div>
            </div>
            <div class="grid_item">
              <div class="card">
                <img src="jd motors.png" alt="Project 1" />
                <div class="card_content">
                  <h3>JD Motors Award 2020</h3>
                </div>
              </div>
            </div>
            <div class="grid_item">
              <div class="card">
                <img src="3peat.png" alt="Project 4" />
                <div class="card_content">
                  <h3>Three-PEAT-2019,2020,2021</h3>
                </div>
              </div>
            </div>
            <div class="grid_item">
              <div class="card">
                <img src="usnews.png" alt="Project 5" />
                <div class="card_content">
                  <h3>2020 US News</h3>
                </div>
              </div>
            </div>
            <div class="grid_item">
              <div class="card">
                <img src="bestbuy.png" alt="Project 6" />
                <div class="card_content">
                  <h3>BEST BUY Award 2020</h3>
                </div>
              </div>
            </div>
          </div>
        </div>
        <br>
        <br>
      </section>
      <section id="new">
        <div class="container">
          <br>
          <br>
          <iframe src="https://en.wikipedia.org/wiki/Dodge" width="101%" height="10000"></iframe>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
